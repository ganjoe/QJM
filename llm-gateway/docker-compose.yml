# LLM Gateway
# ==============================================
# Docker-basierter LLM-Endpunkt mit NVIDIA NeMo Switchyard Router,
# Modell-Management, DeepSeek Harness Web-UI und Dashboard Control Plane.
#
# Services:
#   switchyard      - NVIDIA NeMo Switchyard Proxy / Router (Port 4000)
#   dsh             - DeepSeek Harness Agent Runtime & Web-UI (Port 3080)
#   lm-studio       - LM Studio Container mit Web-UI & REST API (Vulkan / DRI)
#   dashboard       - Control Plane & Hardware/Docker Management (Port 9000)
#   vllm            - (Optional) vLLM auf AMD ROCm (Profile: vllm)
#   ollama-*        - (Optional) Ollama CPU/GPU Embeddings (Profile: ollama)

services:
  # ============================================
  # Switchyard — NVIDIA NeMo LLM Router / Proxy
  # ============================================
  switchyard:
    build:
      context: ./switchyard
      dockerfile: Dockerfile
    image: llm-gw-switchyard:latest
    container_name: llm-gw-switchyard
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./switchyard-config:/config
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CONFIG_PATH=/config/routes.toml
      - PORT=4000
      - HOST=0.0.0.0
    restart: unless-stopped

  # ============================================
  # DeepSeek Harness (dsh) — Agent Web-UI & Runtime
  # ============================================
  dsh:
    build:
      context: ./deepseek-harness
      dockerfile: Dockerfile
    image: llm-gw-dsh:latest
    container_name: llm-gw-dsh
    ports:
      - "3080:3080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dsh-config:/root/.config/dsh
      - ./dsh-config:/root/.dsh
      - ${DSH_WORKSPACE_DIR:-/home/daniel}:/workspace
    environment:
      - PORT=3080
      - HOST=0.0.0.0
      - SWITCHYARD_URL=http://switchyard:4000/v1
    depends_on:
      - switchyard
    restart: unless-stopped

  # ============================================
  # LM Studio — Desktop Web UI & OpenAI REST API
  # ============================================
  lm-studio:
    image: lscr.io/linuxserver/lm-studio:latest
    container_name: llm-gw-lmstudio
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - AUTO_GPU=true
    volumes:
      - ${LMSTUDIO_HOST_DIR:-/home/daniel/.lmstudio}:/config/.lmstudio
      - ${LMSTUDIO_HOST_DIR:-/home/daniel/.lmstudio}:/home/daniel/.lmstudio
    ports:
      - "${LMSTUDIO_API_PORT:-1234}:1234"
      - "${LMSTUDIO_WEB_PORT:-3002}:3001"
    shm_size: "4gb"

  # ============================================
  # Dashboard — Control Plane & Hardware/Docker Manager
  # ============================================
  dashboard:
    build: ./dashboard
    image: llm-gw-dashboard:latest
    container_name: llm-gw-dashboard
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./switchyard-config:/switchyard-config
      - ./dashboard:/app
      - ${LM_STUDIO_MODELS_DIR:-/home/daniel/.lmstudio/models}:/lmstudio-models:ro
    environment:
      - SWITCHYARD_URL=http://switchyard:4000
      - SWITCHYARD_CONFIG_PATH=/switchyard-config/routes.toml
      - LMSTUDIO_URL=http://host.docker.internal:1234
      - LMSTUDIO_WEB_PORT=3002
      - VLLM_URL=http://host.docker.internal:8100
      - OLLAMA_ROUTER_URL=http://ollama:11434
      - DOCKER_SWITCHYARD_CONTAINER=llm-gw-switchyard
      - DOCKER_LMSTUDIO_CONTAINER=llm-gw-lmstudio
      - DOCKER_VLLM_CONTAINER=llm-gw-vllm
      - DOCKER_DSH_CONTAINER=llm-gw-dsh
      - LMSTUDIO_MODELS_PATH=/lmstudio-models
    depends_on:
      - switchyard
    restart: unless-stopped

  # ============================================
  # (Optional) vLLM — Inferenz-Server (ROCm)
  # ============================================
  vllm:
    image: rocm/vllm-dev:rocm7.2.1_navi_ubuntu24.04_py3.12_pytorch_2.9_vllm_0.16.0
    container_name: llm-gw-vllm
    privileged: true
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    ipc: host
    network_mode: host
    shm_size: "8g"
    volumes:
      - ${HF_CACHE_DIR:-./models}:/root/.cache/huggingface
      - ${LM_STUDIO_MODELS_DIR:-/home/daniel/.lmstudio/models}:/lmstudio-models:ro
    environment:
      - VLLM_ROCM_USE_AITER=0
      - VLLM_LOGGING_LEVEL=INFO
      # WICHTIG FÜR RDNA 4 (R9700): Weist ROCm an, den GFX12-Instruktionssatz zu nutzen
      - HSA_OVERRIDE_GFX_VERSION=12.0.0
      - PYTORCH_ROC_ALLOC_CONF=max_split_size_mb:512
    entrypoint: ["vllm", "serve"]
    command: >
      --model ${VLLM_MODEL:-bartowski/Qwen2.5-Coder-32B-Instruct-GGUF:Q4_K_M}
      --tokenizer ${VLLM_TOKENIZER:-Qwen/Qwen2.5-Coder-32B-Instruct}
      --hf-config-path ${VLLM_HF_CONFIG:-Qwen/Qwen2.5-Coder-32B-Instruct}
      --dtype float16
      --host 0.0.0.0
      --port 8100
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.85}
      --enforce-eager
      --tensor-parallel-size 1
      --generation-config auto
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 10
    restart: unless-stopped
    profiles:
      - vllm
      - full

  # ============================================
  # (Optional) Ollama — Embeddings (CPU Backend)
  # ============================================
  ollama-cpu:
    image: ollama/ollama
    container_name: llm-gw-ollama-cpu
    restart: unless-stopped
    volumes:
      - openbrain_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 10s
    profiles:
      - ollama
      - full

  # ============================================
  # (Optional) Ollama — Embeddings (GPU Backend - ROCm)
  # ============================================
  ollama-gpu:
    image: ollama/ollama:rocm
    container_name: llm-gw-ollama-gpu
    restart: unless-stopped
    volumes:
      - openbrain_ollama:/root/.ollama
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "991"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 10s
    profiles:
      - ollama
      - full

  # ============================================
  # (Optional) Ollama Router — CPU/GPU Switcher (Deno)
  # ============================================
  ollama:
    build:
      context: ./ollama-router
      dockerfile: Dockerfile
    container_name: llm-gw-ollama-router
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      CPU_URL: http://ollama-cpu:11434
      GPU_URL: http://ollama-gpu:11434
    depends_on:
      ollama-cpu:
        condition: service_healthy
      ollama-gpu:
        condition: service_started
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://localhost:11434/_router/mode'); if (!r.ok) throw new Error();"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles:
      - ollama
      - full

volumes:
  openbrain_ollama:
    external: true
    name: openbrain_openbrain_ollama
