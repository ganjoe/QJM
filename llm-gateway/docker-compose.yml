# LLM Gateway
# ==============================================
# Docker-basierter LLM-Endpunkt mit NVIDIA NeMo Switchyard Router,
# Modell-Management, DeepSeek Harness Web-UI und Dashboard Control Plane.
#
# Services:
#   switchyard      - NVIDIA NeMo Switchyard Proxy / Router (Port 4000)
#   lm-studio       - LM Studio Container mit Web-UI & REST API (Vulkan / DRI)
#   dashboard       - Control Plane & Hardware/Docker Management (Port 9000)
#   ollama          - (Optional) Ollama CPU Embeddings (Port 11434, Profile: ollama)
#   vllm            - (Optional) vLLM auf AMD ROCm (Port 8100, Profile: vllm)

services:
  # ============================================
  # Switchyard — NVIDIA NeMo LLM Router / Proxy
  # ============================================
  switchyard:
    build:
      context: ./switchyard
      dockerfile: Dockerfile
    image: llm-gw-switchyard:latest
    container_name: llm-gw-switchyard
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./switchyard-config:/config
      - ./switchyard/gateway.py:/app/gateway.py:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CONFIG_PATH=/config/routes.toml
      - PORT=4000
      - HOST=0.0.0.0
      # Interaktive Embedding-Latenz: kleinere Backend-Batches => kuerzere
      # in-flight-Bloecke, damit x_search-Query-Embeddings nicht hinter einem
      # ~56s-YT-Batch warten (MCP-Timeout 60s). Durchsatz bleibt ~gleich (CPU-bound).
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-2}
      # Lange Videos haben >100 Chunks; bei ~7s/Input übersteigt das das 600s,
      # auch ohne Queue-Stau -> das ganze Video scheiterte mit 503. Timeout groesser.
      - EMBED_QUEUE_TIMEOUT=${EMBED_QUEUE_TIMEOUT:-3600}
      # Massenklasse 'yt' darf groessere Backend-Batches fahren: Ollama hat ~0,4 s FIXEN
      # Overhead pro Call, batch 2 -> 3,0 docs/s vs batch 8 -> 5,7 docs/s (gemessen bei
      # 890-Zeichen-Chunks, concurrency=1). Interaktive Klassen bleiben bei Batch 2,
      # damit eine Suche nur auf EINEN Call (~1,3 s) wartet.
      # Messung: batch 8 -> 1,7 s/Call und batch 16 -> 3,6 s/Call bei praktisch identischem
      # Durchsatz (0,22 s/Dokument, kein messbarer Fixkostenanteil mehr). Batch 8 halbiert
      # die Wartezeit einer interaktiven Suche auf den laufenden Call, daher batch 8.
      - EMBED_BATCH_SIZE_YT=${EMBED_BATCH_SIZE_YT:-8}
      # Nur Fallback, falls routes.toml nicht aufloesbar ist (dann greift dieser Wert).
      - EMBED_MODEL_ID=${EMBED_MODEL_ID:-mxbai-embed-large}
    restart: unless-stopped

  # ============================================
  # ============================================
  # CCO MCP Server — Standard MCP & Pipeline Worker
  # ============================================
  mcp-cco:
    build:
      context: ../mcp/agent-cco
      dockerfile: Dockerfile
    image: llm-gw-mcp-cco:latest
    container_name: llm-gw-mcp-cco
    restart: unless-stopped
    depends_on:
      - switchyard
    volumes:
      - ../mcp/agent-cco/prompts:/app/prompts:ro
      - ../mcp/agent-cco/metadata-prompt.txt:/app/metadata-prompt.txt:ro
      - ../mcp/agent-cco/ticker-extraction-prompt.txt:/app/ticker-extraction-prompt.txt:ro
      - ../mcp/agent-cco/cookies.txt:/app/cookies.txt
      - ../mcp/agent-cco/index.ts:/app/index.ts:ro
      - ../mcp/agent-cco/tools:/app/tools:ro
      - ../mcp/agent-cco/workers:/app/workers:ro
      - ../mcp/agent-cco/scripts:/app/scripts:ro
      - ../dsh_playground:/dsh_playground:ro
      - yt-media:/data/yt
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:8001}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      SWITCHYARD_URL: http://switchyard:4000/v1
      EMBED_MODEL: embeddings
      WEB_SCRAPER_URL: ${WEB_SCRAPER_URL:-http://host.docker.internal:8797}
      PORT: "8788"
      AGENT_ID: "cco"
      GLOBAL_BRAIN_ACCESS: "false"
      # --- DeepSeek: direkte LLM-Anbindung fuer Chat/Completion ---
      # Embeddings laufen weiterhin ueber Switchyard/Ollama (SWITCHYARD_URL bleibt gesetzt).
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_VISION_MODEL: ${DEEPSEEK_VISION_MODEL:-deepseek-flash}
      DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-4}
      # Ticker-/Metadaten-Extraktion ist einfach: Reasoning abschalten spart Tokens.
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-off}
      # Retry-/Backoff-/Repair-Steuerung des Metadata-Workers
      MAX_METADATA_ATTEMPTS: ${MAX_METADATA_ATTEMPTS:-5}
      METADATA_RETRY_BASE_MS: ${METADATA_RETRY_BASE_MS:-30000}
      METADATA_RETRY_BATCH: ${METADATA_RETRY_BATCH:-10}
      METADATA_REPAIR_BATCH: ${METADATA_REPAIR_BATCH:-3}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN}
      TWITTER_API_IO_KEY: ${TWITTER_API_IO_KEY}
      X_CLIENT_ID: ${X_CLIENT_ID}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET}
      # --- X-Ingestion Kostensteuerung ---
      # Modus "search": advanced_search mit since_time -> Abrechnung nur pro
      # geliefertem Tweet (~$0.05/Tag statt ~$18/Tag im alten 15-min-Timeline-Betrieb).
      # Modus "timeline": alter Pfad (20er-Page pro Influencer, Liveness-optimiert).
      X_INGESTION_MODE: "search"
      # Suchlauf-Intervall = maximale Aktualität (Kosten sind volumen-, nicht abfrageabhängig)
      X_SEARCH_INTERVAL_SEC: "3600"
      # Überlappung gegen Grenz-/Index-Lücken
      X_SEARCH_OVERLAP_SEC: "900"
      # Sicherheitsnetz: vollständiger Timeline-Abgleich (holt Suchindex-Lücken nach)
      X_RECONCILE_INTERVAL_SEC: "604800"
      # Ab diesem Rückstand übernimmt der Abgleich, die Suche holt nur das letzte Fenster
      X_SEARCH_MAX_CATCHUP_SEC: "86400"
      # Nur für X_INGESTION_MODE=timeline relevant:
      X_DISCOVERY_INTERVAL_SEC: "21600"
      X_LIVENESS_CHECK: "true"
      X_MIN_REQUEST_DELAY_MS: "2500"
      MAX_CONCURRENT_METADATA_WORKERS: ${MAX_CONCURRENT_METADATA_WORKERS:-16}
      MAX_CONCURRENT_YT_CHANNELS: "3"
      EMBEDDING_BATCH_SIZE: "25"
      AUTO_START_WORKERS: "true"
      # --- Embedding (mxbai-embed-large, 512-Token-Kontext, 1024 Dim) ---
      # YT-Chunks muessen unter dem Kontextfenster bleiben: 800 + Header (~100) ~= 900 Zeichen.
      YT_CHUNK_SIZE: "800"
      YT_CHUNK_OVERLAP: "200"
      # Der Gateway-Embedder ist der Flaschenhals (~4,4 Chunks/s Backend). Mit nur 2
      # gleichzeitigen Videos war die Gateway-Queue oft leer (gemessen queue=0) und das
      # Backend stand still, waehrend der Worker DB-Writes machte. Mehr Parallelitaet
      # fuellt die Queue, ohne die interaktive Latenz zu erhoehen (x_search hat Vorrang
      # und wartet nur auf EINEN laufenden Backend-Call).
      YT_EMBED_CONCURRENCY: "4"
      YT_EMBED_BATCH_LIMIT: "6"
      # Dokumenttexte werden VOR dem Hashing wortgrenzen-sauber gekuerzt. 1100 Zeichen sind
      # auch bei dichter Tokenisierung (Transkripte ~2,8 Zeichen/Token) < 512 Tokens; Ollama
      # antwortet oberhalb der Kontextgrenze mit HTTP 400 statt zu trunkieren.
      EMBED_MAX_CHARS: "1100"
      # Erwartete Vektor-Dimension (Guard gegen falsche Gateway-Route -> laut statt still).
      EMBED_DIM: "1024"
      EMBED_VERSION: "mxbai-v1"
      EMBED_MODEL_NAME: "mxbai-embed-large"
    ports:
      - "8788:8788"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - mcp-cco
          - llm-gw-mcp-cco

  # ============================================
  # PTA MCP Server — Execution & Portfolio Management
  # ============================================
  mcp-pta:
    build:
      context: ../mcp/agent-pta
      dockerfile: Dockerfile
    image: llm-gw-mcp-pta:latest
    container_name: llm-gw-mcp-pta
    restart: unless-stopped
    depends_on:
      - switchyard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../mcp/agent-pta/index.ts:/app/index.ts:ro
      - ../mcp/agent-pta/tools:/app/tools:ro
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:8001}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      SWITCHYARD_URL: http://switchyard:4000/v1
      EMBED_MODEL: embeddings
      PORT: "8789"
      AGENT_ID: "pta"
      GLOBAL_BRAIN_ACCESS: "false"
    ports:
      - "8789:8789"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - mcp-pta
          - llm-gw-mcp-pta

  # ============================================
  # PCA Service — Parquet Chart Data & Technical Analysis Engine
  # ============================================
  pca-service:
    build:
      context: ../services/pca-service
      dockerfile: Dockerfile
    image: llm-gw-pca-service:latest
    container_name: qjm-pca-service
    restart: unless-stopped
    environment:
      - PARQUET_BASE_PATH=/parquet
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:8001}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DEFAULT_CANDLE_LIMIT=2000
      - MAX_CANDLE_LIMIT=10000
      - POSTGREST_UNIVERSE_LIMIT=${POSTGREST_UNIVERSE_LIMIT:-20000}
      - UNIVERSE_CACHE_TTL_SEC=${UNIVERSE_CACHE_TTL_SEC:-30}
      # Auto-Watchlist des Universal Scanners: jeder Lauf schreibt ALLE Treffer nach 'scan_latest'
      - SCAN_WATCHLIST_ENABLED=${SCAN_WATCHLIST_ENABLED:-1}
      - SCAN_WATCHLIST_NAME=${SCAN_WATCHLIST_NAME:-scan_latest}
      - SCAN_WATCHLIST_CHUNK_SIZE=${SCAN_WATCHLIST_CHUNK_SIZE:-500}
      - SCAN_WATCHLIST_READ_PAGE=${SCAN_WATCHLIST_READ_PAGE:-1000}
      - SCAN_WATCHLIST_META_ENABLED=${SCAN_WATCHLIST_META_ENABLED:-1}
    volumes:
      - ../services/pca-service:/app
      - /home/daniel/stock-data-node/data/parquet:/parquet:ro
      - /home/daniel/stock-data-node/data/watchlists:/app/watchlists:ro
    ports:
      - "8794:8791"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================
  # PCA MCP Server — Technical Analysis & Watchlist Management
  # ============================================
  mcp-pca:
    build:
      context: ../mcp/agent-pca
      dockerfile: Dockerfile
    image: llm-gw-mcp-pca:latest
    container_name: llm-gw-mcp-pca
    restart: unless-stopped
    depends_on:
      - switchyard
      - pca-service
    volumes:
      - ../mcp/agent-pca/deno.json:/app/deno.json:ro
      - ../mcp/agent-pca/index.ts:/app/index.ts:ro
      - ../mcp/agent-pca/tools:/app/tools:ro
      - /home/daniel/stock-data-node/data/parquet:/parquet:ro
      - /home/daniel/stock-data-node/data/watchlists:/watchlists:ro
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:8001}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      FEATURES_SERVICE_URL: http://host.docker.internal:8003
      PCA_SERVICE_URL: http://pca-service:8791
      STOCK_DATA_NODE_URL: http://stock-data-node:8002
      POSTGREST_UNIVERSE_LIMIT: ${POSTGREST_UNIVERSE_LIMIT:-20000}
      PORT: "8790"
      AGENT_ID: "pca"
      CHART_VIEWER_API_URL: http://chart-viewer-server:8766
    ports:
      - "8790:8790"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - mcp-pca
          - llm-gw-mcp-pca

  # ============================================
  # WIQ MCP Server — Workitem-Graph (Kernprinzip der Engine)
  # ============================================
  mcp-wiq:
    build:
      context: ../mcp/agent-wiq
      dockerfile: Dockerfile
    image: llm-gw-mcp-wiq:latest
    container_name: llm-gw-mcp-wiq
    restart: unless-stopped
    volumes:
      - ../mcp/agent-wiq/deno.json:/app/deno.json:ro
      - ../mcp/agent-wiq/index.ts:/app/index.ts:ro
      - ../mcp/agent-wiq/tools:/app/tools:ro
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:8001}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      PORT: "8798"
      AGENT_ID: "wiq"
    ports:
      - "8798:8798"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - mcp-wiq
          - llm-gw-mcp-wiq

  # ============================================
  # Chart Viewer Server — Agent WebSocket & HTTP Control API
  # ============================================
  chart-viewer-server:
    build:
      context: ../chart_viewer
      dockerfile: Dockerfile.server
    image: llm-gw-chart-viewer-server:latest
    container_name: qjm-chart-viewer-server
    restart: unless-stopped
    environment:
      - PCA_SERVICE_URL=http://pca-service:8791
      - CV_CHART_LIMIT=2000
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:8001}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - CV_AUTOSAVE_DEBOUNCE_SEC=${CV_AUTOSAVE_DEBOUNCE_SEC:-1.5}
      - CV_SUPABASE_TIMEOUT_SEC=${CV_SUPABASE_TIMEOUT_SEC:-10.0}
    volumes:
      - ../chart_viewer/src:/app/src:ro
      - ../chart_viewer/run_server.py:/app/run_server.py:ro
      - ../dsh_playground:/home/daniel/QJM/dsh_playground:rw
      - ../dsh_playground:/dsh_playground:rw
    ports:

      - "8765:8765"
      - "8766:8766"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - chart-viewer-server

  # ============================================
  # WIQ Dashboard — Lesefenster der Workitem-Engine (Client-Bootstrap + API)
  # ============================================
  wiq-dashboard:
    build:
      context: ../wiq_dashboard/server
      dockerfile: Dockerfile
    image: llm-gw-wiq-dashboard:latest
    container_name: qjm-wiq-dashboard
    restart: unless-stopped
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:8001}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WIQ_CLIENT_DIR=/app/client
      - WIQ_SCHEDULES_PY=/app/schedules_source.py
      - PORT=8799
    volumes:
      - ../wiq_dashboard/client:/app/client:ro
      - ../services/secretary/secretary/schedules.py:/app/schedules_source.py:ro
    ports:
      - "8799:8799"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - wiq-dashboard

  # ============================================
  # CDA MCP Server — Chart Download & Data Ingestion Agent
  # ============================================
  mcp-cda:
    build:
      context: ../mcp/agent-cda
      dockerfile: Dockerfile
    image: llm-gw-mcp-cda:latest
    container_name: llm-gw-mcp-cda
    restart: unless-stopped
    depends_on:
      - switchyard
      - stock-data-node
    volumes:
      - ../mcp/agent-cda/deno.json:/app/deno.json:ro
      - ../mcp/agent-cda/index.ts:/app/index.ts:ro
      - ../mcp/agent-cda/tools:/app/tools:ro
      - /home/daniel/stock-data-node/data/documents:/data/documents:rw
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:8001}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      STOCK_DATA_NODE_URL: http://stock-data-node:8002
      DOCUMENTS_BASE_PATH: ${DOCUMENTS_BASE_PATH:-/data/documents}
      PORT: "8795"
      AGENT_ID: "cda"
    ports:
      - "8795:8795"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - mcp-cda
          - llm-gw-mcp-cda

  # ============================================
  # Draw.io MCP Server — Architekturdiagramme (lokale Ablage)
  # ============================================
  mcp-drawio:
    build:
      context: ../mcp/agent-drawio
      dockerfile: Dockerfile
    image: llm-gw-mcp-drawio:latest
    container_name: llm-gw-mcp-drawio
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ../dsh_playground/drawio:/dsh_playground/drawio:rw
    environment:
      PORT: "8796"
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY}
      DRAWIO_BASE_DIR: /dsh_playground/drawio
    ports:
      - "8796:8796"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - mcp-drawio
          - llm-gw-mcp-drawio

  # ============================================
  # Stock Data Node — OHLCV Market Data Pipeline
  # ============================================
  stock-data-node:
    build: /home/daniel/stock-data-node
    container_name: stock-data-node
    restart: unless-stopped
    env_file:
      - /home/daniel/stock-data-node/.env
    environment:
      - APP_BASE_DIR=/app
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:8001}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - UNIVERSE_SYNC_CHUNK_SIZE=${UNIVERSE_SYNC_CHUNK_SIZE:-500}
      - UNIVERSE_SYNC_TIMEOUT=${UNIVERSE_SYNC_TIMEOUT:-30}
      - UNIVERSE_SYNC_ON_STARTUP=${UNIVERSE_SYNC_ON_STARTUP:-true}
    volumes:
      - /home/daniel/stock-data-node/config:/app/config
      - /home/daniel/stock-data-node/src:/app/src
      - /home/daniel/stock-data-node/data:/app/data
      - /home/daniel/stock-data-node/watch:/app/watch
      - /home/daniel/stock-data-node/logs:/app/logs
      - /home/daniel/stock-data-node/state:/app/state
    ports:
      - "8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true

  # ============================================
  # LM Studio — Desktop Web UI & OpenAI REST API
  # ============================================
  lm-studio:
    image: lscr.io/linuxserver/lm-studio:latest
    container_name: llm-gw-lmstudio
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - AUTO_GPU=true
    volumes:
      - ${LMSTUDIO_HOST_DIR:-/home/daniel/.lmstudio}:/config/.lmstudio
      - ${LMSTUDIO_HOST_DIR:-/home/daniel/.lmstudio}:/home/daniel/.lmstudio
    ports:
      - "${LMSTUDIO_API_PORT:-1234}:1234"
      - "${LMSTUDIO_WEB_PORT:-3002}:3001"
    shm_size: "4gb"

  # ============================================
  # Dashboard — Control Plane & Hardware/Docker Manager
  # ============================================
  dashboard:
    build: ./dashboard
    image: llm-gw-dashboard:latest
    container_name: llm-gw-dashboard
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./switchyard-config:/switchyard-config
      - ./dashboard:/app
      - ${LM_STUDIO_MODELS_DIR:-/home/daniel/.lmstudio/models}:/lmstudio-models:ro
      - /sys:/sys:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SWITCHYARD_URL=http://switchyard:4000
      - SWITCHYARD_CONFIG_PATH=/switchyard-config/routes.toml
      - LMSTUDIO_URL=http://host.docker.internal:1234
      - LMSTUDIO_WEB_PORT=3002
      - VLLM_URL=http://host.docker.internal:8100
      - OLLAMA_CPU_URL=http://host.docker.internal:11434
      - DOCKER_SWITCHYARD_CONTAINER=llm-gw-switchyard
      - DOCKER_LMSTUDIO_CONTAINER=llm-gw-lmstudio
      - DOCKER_VLLM_CONTAINER=llm-gw-vllm
      - DOCKER_OLLAMA_CPU_CONTAINER=llm-gw-ollama-cpu
      - LMSTUDIO_MODELS_PATH=/lmstudio-models
    depends_on:
      - switchyard
    restart: unless-stopped

  # ============================================
  # Ollama — Embeddings (CPU Backend)
  # ============================================
  ollama-cpu:
    image: ollama/ollama:latest
    container_name: llm-gw-ollama-cpu
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      # -1 = Modell wird niemals entladen. Das Embedding-Modell muss immer bereitstehen;
      # ein Kaltstart kostet das Neuladen der ~6 GB und war die Hauptursache für Latenzspitzen.
      - OLLAMA_KEEP_ALIVE=-1
      # Parallelität per Benchmark bestimmt: 1, 2 und 4 Slots lieferten identischen Durchsatz
      # (~6,3 Inputs/s) und identische Latenz, weil die CPU der Flaschenhals ist. 1 Slot
      # vermeidet zusätzlich Kontext-Aufteilung (4096 / NUM_PARALLEL).
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-4096}
    volumes:
      - openbrain_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 10s

  # ============================================
  # (Optional) vLLM — Inferenz-Server (ROCm)
  # ============================================
  vllm:
    image: rocm/vllm-dev:rocm7.2.1_navi_ubuntu24.04_py3.12_pytorch_2.9_vllm_0.16.0
    container_name: llm-gw-vllm
    privileged: true
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    ipc: host
    network_mode: host
    shm_size: "8g"
    volumes:
      - ${HF_CACHE_DIR:-./models}:/root/.cache/huggingface
      - ${LM_STUDIO_MODELS_DIR:-/home/daniel/.lmstudio/models}:/lmstudio-models:ro
    environment:
      - VLLM_ROCM_USE_AITER=0
      - VLLM_LOGGING_LEVEL=INFO
      # WICHTIG FÜR RDNA 4 (R9700): Weist ROCm an, den GFX12-Instruktionssatz zu nutzen
      - HSA_OVERRIDE_GFX_VERSION=12.0.0
      - PYTORCH_ROC_ALLOC_CONF=max_split_size_mb:512
    entrypoint: ["vllm", "serve"]
    command: >
      --model ${VLLM_MODEL:-bartowski/Qwen2.5-Coder-32B-Instruct-GGUF:Q4_K_M}
      --tokenizer ${VLLM_TOKENIZER:-Qwen/Qwen2.5-Coder-32B-Instruct}
      --hf-config-path ${VLLM_HF_CONFIG:-Qwen/Qwen2.5-Coder-32B-Instruct}
      --dtype float16
      --host 0.0.0.0
      --port 8100
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL:-0.85}
      --enforce-eager
      --tensor-parallel-size 1
      --generation-config auto
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 10
    restart: unless-stopped
    profiles:
      - vllm
      - full

volumes:
  openbrain_ollama:
    external: true
    name: openbrain_openbrain_ollama
  yt-media:
