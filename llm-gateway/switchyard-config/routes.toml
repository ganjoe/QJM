schema_version = 1

[llm_clients.gemini]
format = "openai_chat"
base_url = "http://dashboard:9000/api/gemini/v1"

[llm_clients.ollama_cpu]
format = "openai_chat"
base_url = "http://host.docker.internal:11434/v1"

# --- Targets (Google Gemini) ---
[targets.gemini_31_pro]
id = "gemini-3.1-pro-preview"
llm_client = "gemini"

[targets.gemini_flash]
id = "gemini-3.8-flash"
llm_client = "gemini"

[targets.gemini_free_lite]
id = "gemini-3.5-flash-lite"
llm_client = "gemini"

# --- Targets (Embeddings CPU) ---
[targets.ollama_embed_cpu]
id = "qwen3-embedding:8b"
llm_client = "ollama_cpu"

# --- Routes ---
[routes.pro]
id = "pro"
type = "passthrough"
target = "gemini_31_pro"

[routes.reasoning]
id = "reasoning"
type = "passthrough"
target = "gemini_31_pro"

[routes.flash]
id = "flash"
type = "passthrough"
target = "gemini_flash"

[routes.fast]
id = "fast"
type = "passthrough"
target = "gemini_flash"

[routes.free]
id = "free"
type = "passthrough"
target = "gemini_free_lite"

[routes.auto]
id = "auto"
type = "llm_classifier"
mode = "capability"
classifier_target = "gemini_free_lite"
weak_target = "gemini_free_lite"
strong_target = "gemini_31_pro"
base_threshold = 0.5
threshold_step = 0.1

[routes.embeddings]
id = "embeddings"
type = "passthrough"
target = "ollama_embed_cpu"

[routes.embeddings_cpu]
id = "embeddings_cpu"
type = "passthrough"
target = "ollama_embed_cpu"

