schema_version = 1

[llm_clients.lmstudio]
format = "openai_chat"
base_url = "http://host.docker.internal:1234/v1"

[llm_clients.gemini]
format = "openai_chat"
base_url = "http://dashboard:9000/api/gemini/v1"

[llm_clients.ollama]
format = "openai_chat"
base_url = "http://host.docker.internal:11434/v1"

[targets.local_model]
id = "default"
llm_client = "lmstudio"

[targets.gemini_31_pro]
id = "gemini-3.1-pro-preview"
llm_client = "gemini"

[targets.gemini_36_flash]
id = "gemini-3.6-flash"
llm_client = "gemini"

[targets.gemini_35_lite]
id = "gemini-3.5-flash-lite"
llm_client = "gemini"

[targets.gemini_35_flash]
id = "gemini-3.5-flash"
llm_client = "gemini"

[targets.ollama_embed]
id = "qwen3-embedding:8b"
llm_client = "ollama"

[routes.local]
id = "local"
type = "passthrough"
target = "local_model"

[routes.reasoning]
id = "reasoning"
type = "passthrough"
target = "gemini_31_pro"

[routes.fast]
id = "fast"
type = "passthrough"
target = "gemini_35_lite"

[routes.auto]
id = "auto"
type = "llm_classifier"
mode = "capability"
classifier_target = "gemini_35_lite"
weak_target = "local_model"
strong_target = "gemini_31_pro"
base_threshold = 0.5
threshold_step = 0.1

[routes.embeddings]
id = "embeddings"
type = "passthrough"
target = "ollama_embed"
