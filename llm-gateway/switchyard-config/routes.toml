schema_version = 1

[llm_clients.gemini]
format = "openai_chat"
base_url = "http://dashboard:9000/api/gemini/v1"

[llm_clients.ollama_cpu]
format = "openai_chat"
base_url = "http://host.docker.internal:11434/v1"

# --- Targets (Google Gemini) ---
[targets.gemini_31_pro]
id = "gemini-3.1-pro-preview"
llm_client = "gemini"

[targets.gemini_flash]
id = "gemini-3.8-flash"
llm_client = "gemini"

[targets.gemini_free_lite]
id = "gemini-3.5-flash-lite"
llm_client = "gemini"

# --- Targets (Embeddings CPU) ---
# mxbai-embed-large (Mixedbread, BERT/334M, 1024 Dim, 512-Token-Kontext, englisch).
# Ablösung von qwen3-embedding:8b (4096 Dim) am 2026-09-18: ~17x schneller pro Zeichen
# bei praktisch gleichem Retrieval (Golden-Set R@1 0,92 vs. 1,00) und 1024 Dim <= 2000
# => HNSW-Index moeglich (mit 4096 Dim nicht).
[targets.ollama_embed_cpu]
id = "mxbai-embed-large"
llm_client = "ollama_cpu"

# --- Routes ---
[routes.pro]
id = "pro"
type = "passthrough"
target = "gemini_31_pro"

[routes.reasoning]
id = "reasoning"
type = "passthrough"
target = "gemini_31_pro"

[routes.flash]
id = "flash"
type = "passthrough"
target = "gemini_flash"

[routes.fast]
id = "fast"
type = "passthrough"
target = "gemini_flash"

[routes.free]
id = "free"
type = "passthrough"
target = "gemini_free_lite"

[routes.auto]
id = "auto"
type = "llm_classifier"
mode = "capability"
classifier_target = "gemini_free_lite"
weak_target = "gemini_free_lite"
strong_target = "gemini_31_pro"
base_threshold = 0.5
threshold_step = 0.1

# --- Embeddings (genau EIN Backend, kein GPU-Target) ---
# 'mxbai-embed-large' ist auf 1024 Dimensionen fixiert; ein anderes Modell würde Vektoren
# eines fremden Raums in denselben Index schreiben. Es gibt deshalb bewusst KEINEN
# Modell-Fallback (der Agent prueft die Dimension zusaetzlich clientseitig, EMBED_DIM=1024).
# Dokumente werden ROH eingebettet; NUR Queries bekommen den Prefix
# "Represent this sentence for searching relevant passages: " (mxbai-Modellkarte).
# Kontextgrenze: 512 TOKENS PRO INPUT — oberhalb antwortet Ollama mit HTTP 400 (kein
# zuverlaessiges Trunkieren). Die Agenten kuerzen Dokumenttexte deshalb vor dem Hashing auf
# EMBED_MAX_CHARS=1100 (gemessen: dichte Transkripte ~2,8 Zeichen/Token) und fangen einen
# 400er zusaetzlich mit schrittweise kleinerem Budget ab (getDocumentEmbeddingsDetailed).
# YT-Chunking: YT_CHUNK_SIZE=800 + Header (~90 Zeichen).
#
# Priorisierung übernimmt der Gateway-Scheduler (switchyard/gateway.py), gesteuert über das
# Body-Feld "priority":  x_search (interaktiv) > x_post (X-Posts/Profile) > yt (Massenlast).
# keep_alive=-1 hält das Modell dauerhaft geladen (native /api/embed-API).
[routes.embeddings]
id = "embeddings"
type = "passthrough"
target = "ollama_embed_cpu"

[routes.embeddings_cpu]
id = "embeddings_cpu"
type = "passthrough"
target = "ollama_embed_cpu"

