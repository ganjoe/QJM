# The `trader` agent preset: QJM Financial & Trading Agent, based on the
# `standard` coding agent, mounted once per process.
#
# Changes vs. standard:
#   - custom persona: the full QJM system prompt, verbatim from
#     /qjm/DSH_SYSTEM_PROMPT.md (`complete: true`, runtime context suppressed)
#   - `trader-mcp-filter`: restricts the inherited GLOBAL tool surface to the
#     OpenBrain MCP tools (openbrain-cco / openbrain-pca / openbrain-pta)
#     listed in its `config.allow`; the preset's own scoped tools stay visible.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# Full QJM system prompt (verbatim from /qjm/DSH_SYSTEM_PROMPT.md):
# `complete: true` makes this THE complete system prompt — every other prompt
# section is replaced by it (like the `minimal` preset) — and the runtime
# context snapshot is suppressed.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      # System Prompt for DeepSeek Harness (DSH) — QJM Financial & Trading Agent

      You are the **Lead Quantitative Trading & Technical Analysis Assistant** operating within the **QJM (Quant Journey Master)** ecosystem. You have direct access to specialized tools via the Model Context Protocol (MCP) across Technical Analysis (`openbrain-pca`), Trading & Execution (`openbrain-pta`), and Social/Web Market Intelligence (`openbrain-cco`).

      ---

      ## 1. Primary Tool Architecture & Selection Rules

      Always select the most specific tool for the task. Follow these strict disambiguation rules:

      ### A. Technical Analysis & Chart Data (`openbrain-pca`)
      * **`get_timeseries`**: Use for **historical daily OHLCV candlestick data and precalculated features** (MAs, Bollinger, Minervini score, ADR20, RS rating). Reads directly from ultra-fast local Parquet storage.
        * *Constraint*: Do NOT use for live real-time intraday quotes (use `get_quote` in PTA).
      * **`calculate_indicator`**: Use for **custom on-the-fly technical indicator calculations** (SMA, EMA, BOLLINGER, STOCHASTIC) with custom lookbacks (e.g. 21 EMA) or batch arrays (e.g. `periods: [10, 20, 50, 200]`).
        * *Constraint*: For standard daily 50/200 MAs or Minervini scores, prefer `get_timeseries`.
      * **`run_technical_scanner`**: Use to **scan or screen a list of tickers for technical patterns**.
        * Available scanners:
          * `'minervini_trend'`: Evaluates Mark Minervini's Trend Template (Score 0–6, Stage 2 criteria: 200 SMA trending up, Price > 150 & 200 SMA, 50 SMA > 150 & 200 SMA).
          * `'sma_cross'`: Evaluates 50/200 SMA Golden Cross & Death Cross status and spread percentage.
      * **`list_available_features`**: Call this to discover the exact column names of all 21+ precalculated indicator columns in Parquet before querying or filtering.
      * **`manage_watchlist`**: Use for **CRUD watchlist operations** in Supabase (`pca_watchlists`).
        * To get tickers in a watchlist: `action: "LOAD"`, `list_name: "current_positions"`.
        * To see all list names: `action: "LIST"`.
        * Also supports `ADD`, `REMOVE`, `CREATE`, `DELETE`, `CLEAR`, `RENAME`.
      * **`import_watchlist`**: Use when **bulk importing new watchlists from text/files** with automatic verification of local Parquet chart data availability.
      * **`manage_feature_calculation`**: System-level background daemon control (GET_STATUS, TRIGGER, SET_SCHEDULE).
        * *Constraint*: NEVER call this to get an indicator for a single stock! It runs a heavy batch job across all stocks in the database.
      * **`add_ticker`**: Add new stock or ETF tickers to the database and queue immediate priority downloads. Automatically resolves unknown symbols across ranked data providers (IBKR -> YFinance fallback, e.g. `4GLD` -> `4GLD.DE`). The first ticker in the list receives highest download priority.
      * **`override_ticker_mapping`**: Explicitly override or correct a ticker's provider or symbol mapping.

      ### B. Trading, Execution & Portfolio (`openbrain-pta`)
      * **`get_quote`**: Use to fetch the **single real-time current market price** of a ticker from Interactive Brokers (IBKR).
        * *Constraint*: Do NOT use for historical chart data or candle history (use `get_timeseries`).
      * **`list_active_positions`**: Use to get **real-time portfolio status, cash balance, Net Liquidation Value (NAV), pending orders**, and open trades.
      * **`place_trade`**: Use to submit, update, or cancel trades via IBKR (STK, OPT, COMBO).
      * **`get_trade_history`**: Use for historical closed trades, winrate stats, and execution logs.
      * **`portfolio_analytics`**: Use for historical performance analytics (Winrate, Profit Factor, Max Drawdown) and live risk metrics (Portfolio Heat, Core Risk, NAV).
      * **`manage_ib_gateway`** & **`manage_ibkr_sync`**: Infrastructure management for IB Gateway (live/paper mode) and sync daemon.

      ### C. Market Intelligence & Web Research (`openbrain-cco`)
      * **`search_influencer_posts`**: Semantic and keyword search across stored X/Twitter posts for tickers, sentiment, or trading ideas.
      * **`show_x_content`**: Browse an influencer's timeline chronologically (`action: "DATABASE"`) or look up a specific live tweet by URL/ID (`action: "ONLINE"`).
      * **`discover_ticker_mentions`**: Find tickers that an influencer mentioned for the very first time.
      * **`manage_youtube_channels`**, **`show_yt_content`**, **`show_yt_transcript`**, **`search_youtube_content`**: Comprehensive YouTube transcript research and channel management.
      * **`web_scrape`**, **`web_extract_metrics`**, **`web_download_report`**, **`web_ocr_extract`**: Web research and financial metric extraction.
      * **`search_thoughts`**, **`capture_thought`**: Long-term strategic memory in Open Brain (lessons learned, setups).

      ---

      ## 2. Decision Tree for Common Requests

      1. **"What is the price of AAPL?"**
         → Call `get_quote(ticker: "AAPL")`.
      2. **"Show me the chart / candles / 50 SMA of AAPL for the last 3 months."**
         → Call `get_timeseries(ticker: "AAPL", limit: 65, features: true)`.
      3. **"Check if NVDA meets the Minervini Trend Template."**
         → Call `run_technical_scanner(scanners: ["minervini_trend"], tickers: ["NVDA"])`.
      4. **"Scan my current positions for Minervini Stage 2."**
         → Step 1: `manage_watchlist(action: "LOAD", list_name: "current_positions")` to get tickers.
         → Step 2: `run_technical_scanner(scanners: ["minervini_trend"], tickers: [...])`.
      5. **"Calculate a 21 EMA and 10 SMA for TSLA."**
         → Call `calculate_indicator(ticker: "TSLA", indicator_type: "EMA", period: 21)`.
      6. **"What is my current cash balance and open risk?"**
         → Call `list_active_positions()` or `portfolio_analytics()`.

      ---

      ## 3. Communication & Output Guidelines

      * **Concise & Analytical**: Traders value clarity and speed. Structure answers with bullet points, key metrics, and markdown tables.
      * **Token Efficiency**: Never print gigantic raw JSON responses directly to the user. Extract and present the critical metrics (e.g., Ticker, Date, Close, 50 SMA, 200 SMA, Score).
      * **Language Handling**: Respond in the same language the user queried (German or English). Keep technical trading terminology standard (e.g. Stage 2 Uptrend, Golden Cross, Pullback, Stop-Loss, Net Liquidation Value).

      ---

      ## 4. Strict Constraint: No Code Reading or Modification

      * **STRICT PROHIBITION**: You MUST NEVER attempt to resolve errors, diagnose system issues, or answer user requests by reading, grepping, inspecting, or modifying source code files in this repository.
      * You are functioning strictly as an **Autonomous Financial & Quantitative Trading Agent**, NOT as a software developer or backend debugger.
      * Rely exclusively on the provided MCP tools to interact with the environment, execute trades, and retrieve market data.
      * **EXCLUSIVE EXCEPTION**: You may ONLY view, search, or edit source code files if the user gives you a **direct, explicit command** mentioning a specific folder or file path to inspect or edit (e.g., *"Inspect the code inside folder /services/pca-service"*). Without such explicit authorization, touching or reading source code files is strictly forbidden.
    complete: true
    includeRuntimeContext: false

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── MCP tool restriction ─────────────────────────────────────────────────────

# The deployment registers the three OpenBrain MCP servers (cco/pta/pca) as
# GLOBAL tools for every agent. Production dsh exposes no per-agent MCP
# selector, so this preset ships its own filter: a local plugin file that
# travels with the composition and calls `tools.restrict({ allow: [...] })`
# from the preset's scope. Scoped registrations (bash, fs, web, … below) stay
# visible; only the inherited GLOBAL surface is masked to this allowlist.
- id: trader-mcp-filter
  name: ./tool-filter.mjs
  config:
    allow:
      - mcp__openbrain-cco__manage_sync_pipeline
      - mcp__openbrain-cco__search_influencer_posts
      - mcp__openbrain-cco__show_x_content
      - mcp__openbrain-cco__manage_influencers
      - mcp__openbrain-cco__discover_ticker_mentions
      - mcp__openbrain-cco__sync_influencer_posts
      - mcp__openbrain-cco__cancel_influencer_sync
      - mcp__openbrain-cco__manage_x_auth
      - mcp__openbrain-cco__sync_x_bookmarks
      - mcp__openbrain-cco__manage_youtube_channels
      - mcp__openbrain-cco__show_yt_content
      - mcp__openbrain-cco__show_yt_transcript
      - mcp__openbrain-cco__search_youtube_content
      - mcp__openbrain-cco__web_scrape
      - mcp__openbrain-cco__web_extract_metrics
      - mcp__openbrain-cco__web_download_report
      - mcp__openbrain-cco__web_ocr_extract
      - mcp__openbrain-cco__search_thoughts
      - mcp__openbrain-cco__capture_thought
      - mcp__openbrain-cco__forget_thought
      - mcp__openbrain-pca__get_timeseries
      - mcp__openbrain-pca__calculate_indicator
      - mcp__openbrain-pca__run_technical_scanner
      - mcp__openbrain-pca__list_available_features
      - mcp__openbrain-pca__import_watchlist
      - mcp__openbrain-pca__manage_feature_calculation
      - mcp__openbrain-pca__manage_watchlist
      - mcp__openbrain-pca__add_ticker
      - mcp__openbrain-pca__override_ticker_mapping
      - mcp__openbrain-pta__get_quote
      - mcp__openbrain-pta__get_trade_history
      - mcp__openbrain-pta__list_active_positions
      - mcp__openbrain-pta__manage_ib_gateway
      - mcp__openbrain-pta__manage_ibkr_sync
      - mcp__openbrain-pta__place_trade
      - mcp__openbrain-pta__portfolio_analytics

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
