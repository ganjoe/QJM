[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-viewer"
version = "0.1.0"
description = "TC2000-like desktop chart viewer controlled by an agent"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "msgspec>=0.18.0",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
